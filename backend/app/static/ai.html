<style>
:root{--ink:#202522;--muted:#717974;--line:#303532;--paper:#fff;--soft:#f5f4f0;--paper-warm:#faf8f3;--accent:#a56243;--nav:68px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:"SimSun","Songti SC","STSong",serif;line-height:1.75}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.site-header{position:sticky;top:0;z-index:30;height:68px;background:#fffffff2;backdrop-filter:blur(16px)}.nav-shell{width:min(1360px,calc(100% - 80px));height:100%;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}.brand{justify-self:start;display:flex;flex-direction:column;line-height:1.15;letter-spacing:.12em}.brand strong{font-size:18px;font-weight:500;letter-spacing:.12em}.brand small{margin-top:5px;color:var(--muted);font-size:8px;letter-spacing:.28em}.main-nav{display:flex;align-items:center;gap:4px;width:max-content;height:42px;padding:4px;border-radius:999px;background:#f2eee7;box-shadow:0 8px 22px #2025220d}.main-nav a{display:flex;align-items:center;gap:8px;height:34px;padding:0 16px;border-radius:999px;color:#68726c;font-size:16px;font-weight:500;line-height:1;white-space:nowrap;background:#f7f4ee;transition:.2s}.main-nav a:hover{background:#fff;color:var(--ink)}.main-nav a.active{background:#fff;color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 #a56243,0 4px 12px #2025220a}.main-nav svg{width:16px;height:16px;opacity:.72}.main-nav a.active svg{opacity:1;color:#a56243}.header-action{justify-self:end;border-radius:999px;padding:7px 15px;background:#f7f4ee;color:#68726c;font-size:12px}
.ai-page{width:min(940px,calc(100% - 48px));min-height:calc(100svh - 68px);margin:0 auto;display:flex;flex-direction:column;padding:26px 0 18px}.conversation{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;scrollbar-width:thin;scrollbar-color:#c7c9c4 transparent}.welcome{max-width:690px;margin:0 auto;padding:54px 20px 28px;text-align:center}.welcome h1{margin:0;font-family:"STKaiti","KaiTi",serif;font-size:clamp(32px,4vw,48px);font-weight:400;line-height:1.35;letter-spacing:.04em}.welcome p{max-width:540px;margin:14px auto 0;color:var(--muted);font-size:14px;line-height:1.95}.welcome small{display:block;margin-top:18px;color:#9a9f9b;font-size:11px;letter-spacing:.08em}.messages{display:flex;flex-direction:column;gap:16px;padding:24px 0 18px}.messages:empty{display:none}.message{max-width:78%;animation:messageIn .25s ease both}.message .who{display:block;margin:0 0 6px;color:#8a918c;font-size:10px;letter-spacing:.12em}.message .bubble{padding:13px 16px;font-size:14px;line-height:1.9}.message.bot .bubble{background:#f7f5f0;color:#38423d}.message.user{align-self:flex-end;margin-left:auto}.message.user .bubble{background:#202522;color:#fff}.typing .bubble{color:#858d88}.typing .bubble:after{content:"…";animation:dots 1.2s steps(3,end) infinite}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 14px;transition:opacity .2s ease}.suggestions.hidden{display:none}.suggestions button{padding:7px 12px;border-radius:999px;background:#f7f4ee;color:#666f69;font-size:11px;transition:.2s}.suggestions button:hover{background:#eee9e1;color:var(--ink)}
.composer{position:relative;background:#fff;border:1px solid #ddd9d1;border-radius:18px;box-shadow:0 10px 36px #2025220b;padding:14px 14px 9px;transition:border-color .2s ease,box-shadow .2s ease}.composer:focus-within{border-color:#bfa99a;box-shadow:0 14px 42px #20252212}.composer textarea{display:block;width:100%;min-height:40px;max-height:130px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;line-height:1.65;padding:2px 4px}.composer textarea::placeholder{color:#9da29e}.composer-tools{display:flex;align-items:center;gap:9px;min-height:36px;margin-top:7px}.model-tag{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:#f7f4ee;color:#5f6862;font-size:11px}.model-tag:before{content:"";width:6px;height:6px;border-radius:50%;background:#a56243}.archive-note{color:#8b918d;font-size:10px;letter-spacing:.04em}.send-button{width:36px;height:36px;margin-left:auto;display:grid;place-items:center;border-radius:50%;background:#202522;color:#fff;font-size:18px;transition:.2s}.send-button:hover{background:#a56243;transform:translateY(-1px)}.send-button:disabled{opacity:.38;cursor:default;transform:none}.footer-note{padding:12px 0 0;color:#9a9f9b;font-size:10px;text-align:center}
@keyframes messageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes dots{0%,20%{content:"."}40%{content:".."}60%,100%{content:"..."}}
@media(max-width:1120px){.nav-shell{width:calc(100% - 32px)}.main-nav{gap:2px}.main-nav a{padding:0 12px;font-size:15px;gap:6px}.main-nav svg{width:15px;height:15px}.header-action{padding:7px 12px}}
@media(max-width:900px){.nav-shell{grid-template-columns:1fr auto}.main-nav{display:none}.ai-page{width:calc(100% - 28px);padding-top:14px}.welcome{padding:26px 8px 20px}.welcome h1{font-size:clamp(30px,10vw,42px)}.messages{max-width:none}.message{max-width:90%}.composer-tools{flex-wrap:wrap}.archive-note{display:none}.footer-note{padding-bottom:6px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.message{animation:none}.typing .bubble:after{animation:none}}

@media(max-width:900px){.ai-line-bamboo{left:-88px;bottom:150px;width:180px;opacity:.07}.ai-line-plum{right:-100px;top:80px;width:210px;opacity:.07}.ai-line-mountains{right:-90px;bottom:-30px;width:220px;opacity:.05}.ai-verse{right:0;font-size:9px;opacity:.35}.welcome-watermark{font-size:140px}.welcome-kicker{font-size:9px!important;letter-spacing:.12em!important}}

.welcome{transform:translateY(-54px)}

@media(max-width:900px){.welcome{transform:translateY(-24px)}.ai-line-bamboo{left:-110px}.ai-line-plum{right:-122px}.ai-line-mountains{right:-108px}}
@media(max-width:520px){.welcome{transform:translateY(-12px)}}
/* Keep decorative line art inside the AI page frame */
.ai-page{overflow:hidden}
.ai-line-bamboo{left:0;bottom:150px;width:190px;transform:none;opacity:.08}

@media(max-width:900px){.ai-line-bamboo{left:0;bottom:170px;width:150px;opacity:.07}.ai-line-plum{right:0;top:104px;width:160px;opacity:.07}.ai-line-mountains{right:0;bottom:120px;width:160px;opacity:.05}}
@media(max-width:520px){.ai-line-bamboo{display:none}.ai-line-plum{right:0;top:105px;width:118px;opacity:.06}.ai-line-mountains{right:0;bottom:150px;width:118px;opacity:.045}}

.message .answer-meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0;color:#8a918c;font-size:10px;letter-spacing:.04em}
.message .answer-meta span{padding:3px 8px;border:1px solid #e7e1d8;background:#fcfbf8}
.message .source-list{display:flex;flex-direction:column;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid #e8e2d9}
.message .source-list a{display:block;padding:8px 10px;background:#fff;border:1px solid #e8e2d9;color:#4e5a54;font-size:11px;line-height:1.55;text-decoration:none;transition:.2s}
.message .source-list a:hover{border-color:#a56243;color:#29312d;transform:translateY(-1px)}
.message .source-list b{display:block;color:#29312d;font-weight:500}

</style>

<body>
<header class="site-header"><div class="nav-shell"><a class="brand" href="/"><strong>寻迹三秦</strong><small>TRADITIONAL VILLAGES OF SHAANXI</small></a><nav class="main-nav" aria-label="主导航"><a href="/"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 10.5 12 4.2l7.5 6.3v9.1h-5v-5.8h-5v5.8h-5v-9.1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>首页</span></a><a href="/villages"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s6.3-5.2 6.3-11.4a6.3 6.3 0 1 0-12.6 0C5.7 15.8 12 21 12 21Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.2" stroke="currentColor" stroke-width="1.6"/></svg><span>村落分布</span></a><a class="active" href="/ai"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m18.5 16 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z" fill="currentColor"/></svg><span>AI问答</span></a></nav><a class="header-action" href="/feedback">意见反馈</a></div></header>
<main class="ai-page"><img class="ai-line ai-line-bamboo" src="/static/home-demo/line-bamboo.svg" alt="" aria-hidden="true"><img class="ai-line ai-line-plum" src="/static/home-demo/line-plum.svg" alt="" aria-hidden="true"><img class="ai-line ai-line-mountains" src="/static/home-demo/line-mountains.svg" alt="" aria-hidden="true"><span class="ai-verse" aria-hidden="true">山水有境 · 问村有答</span><section class="conversation" aria-label="村落导游对话"><div class="welcome" id="welcome"><span class="welcome-watermark" aria-hidden="true">问</span><p class="welcome-kicker">SHAANXI VILLAGE GUIDE · 小秦同学</p><h1><span class="art-copper">想先了解</span><br><span class="art-blue">哪一座陕西传统村落？</span></h1><p>我是小秦同学，可以带你从村落档案中了解历史、建筑、环境、民俗、物产与旅行路线。</p><small>村落档案 · 有依据地回答</small></div><div class="messages" id="messages" role="log" aria-live="polite"></div></section><div class="suggestions" id="suggestions"><button type="button">党家村有哪些代表性建筑？</button><button type="button">陕北窑洞和陕南民居有什么区别？</button><button type="button">推荐一条渭南古村路线。</button></div><form class="composer" id="chatForm"><label class="sr-only" for="chatInput">向小秦同学提问</label><textarea id="chatInput" rows="1" placeholder="问问小秦：这个村落有什么故事？" autocomplete="off"></textarea><div class="composer-tools"><span class="model-tag">小秦同学 · 村落档案</span><span class="archive-note">基于已整理资料回答</span><label class="thinking-toggle"><input id="deepThinking" type="checkbox" checked><span>深度思考</span></label><button class="send-button" id="sendButton" type="submit" aria-label="发送问题">↑</button></div></form><p class="footer-note">基于已整理村落档案与正规公开来源回答；资料不足时会明确说明。</p></main>
<script>
const form=document.getElementById('chatForm'),input=document.getElementById('chatInput'),messages=document.getElementById('messages'),conversation=document.querySelector('.conversation'),welcome=document.getElementById('welcome'),suggestions=document.getElementById('suggestions'),sendButton=document.getElementById('sendButton'),deepThinking=document.getElementById('deepThinking');
let busy=false,history=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function scrollBottom(){requestAnimationFrame(()=>{conversation.scrollTop=conversation.scrollHeight})}
function paragraphs(text){return String(text||'').split(/\n{2,}/).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}
function addMessage(text,user=false){const row=document.createElement('div');row.className='message '+(user?'user':'bot');row.innerHTML=`<span class="who">${user?'你':'小秦同学'}</span><div class="bubble">${paragraphs(text)}</div>`;messages.appendChild(row);scrollBottom();return row}
function sourceList(sources){if(!sources?.length)return '';return `<div class="source-list">${sources.map(s=>{const raw=String(s.url||'');const url=/^(https?:\/\/|\/)/.test(raw)?raw:'#';const label=s.kind==='web'?'正规公开网页':'村落档案';return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer"><b>[${esc(s.id)}] ${esc(s.title||'资料来源')}</b><small>${esc(label)}${s.domain?' · '+esc(s.domain):''}${s.village?' · '+esc(s.village):''}${s.section?' · '+esc(s.section):''}</small></a>`}).join('')}</div>`}
function addBotAnswer(text,sources,meta={}){const row=document.createElement('div');row.className='message bot';const badges=[];if(meta.deep_thinking_used)badges.push('深度思考');if(meta.web_search_used)badges.push('已检索正规网页');if(meta.mode==='conversation')badges.push('小秦同学');else if(meta.mode?.includes('deepseek'))badges.push('DeepSeek 已核验');else if(meta.mode?.includes('web'))badges.push('已引用官方网页');else if(meta.mode?.includes('archive'))badges.push('本地档案');row.innerHTML=`<span class="who">小秦同学</span><div class="bubble">${paragraphs(text)}</div>${badges.length?`<div class="answer-meta">${badges.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}${sourceList(sources)}${meta.warning?`<p class="message-warning">${esc(meta.warning)}</p>`:''}`;messages.appendChild(row);scrollBottom();return row}
function resizeInput(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px';sendButton.disabled=busy||!input.value.trim()}
async function ask(question){const q=String(question||'').trim();if(!q||busy)return;const prior=history.slice(-6).map(x=>({role:x.role,content:x.content}));busy=true;welcome.hidden=true;suggestions.classList.add('hidden');addMessage(q,true);input.value='';resizeInput();const typing=document.createElement('div');typing.className='message bot typing';typing.innerHTML=`<span class="who">小秦同学</span><div class="bubble">${deepThinking?.checked?'正在检索档案并进行深度思考…':'正在查阅村落档案…'}</div>`;messages.appendChild(typing);scrollBottom();try{const response=await fetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:prior,deep_thinking:Boolean(deepThinking?.checked)})});const data=await response.json().catch(()=>({}));if(!response.ok){const detail=Array.isArray(data.detail)?data.detail.map(x=>x.msg||x).join('；'):data.detail;throw new Error(detail||`问答服务暂时不可用（${response.status}）`)}typing.remove();history.push({role:'user',content:q});history.push({role:'assistant',content:data.answer||''});addBotAnswer(data.answer||'暂时没有生成有效回答。',data.sources||[],data)}catch(err){typing.remove();const row=addMessage(`暂时无法完成回答：${err.message}`);row.classList.add('error')}finally{busy=false;resizeInput();input.focus()}}
input.addEventListener('input',resizeInput);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
suggestions.querySelectorAll('button').forEach(button=>button.onclick=()=>ask(button.textContent));
form.addEventListener('submit',e=>{e.preventDefault();ask(input.value)});resizeInput();
</script>
<script>window.addEventListener("pageshow",event=>{if(event.persisted)window.location.reload()});</script>
