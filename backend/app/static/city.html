/* Unified global navigation */
.site-header{position:sticky;top:0;z-index:30;height:78px;background:#fffffff2;backdrop-filter:blur(16px);border-bottom:0}

.brand{justify-self:start;display:flex;flex-direction:column;line-height:1.15;letter-spacing:.12em}

.main-nav a.active svg{opacity:1;color:var(--accent)}

<header class="site-header"><div class="nav-shell"><a class="brand" href="/"><strong>寻迹三秦</strong><small>TRADITIONAL VILLAGES OF SHAANXI</small></a><nav class="main-nav" aria-label="主导航"><a href="/"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 10.5 12 4.2l7.5 6.3v9.1h-5v-5.8h-5v5.8h-5v-9.1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>首页</span></a><a class="active" href="/villages"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s6.3-5.2 6.3-11.4a6.3 6.3 0 1 0-12.6 0C5.7 15.8 12 21 12 21Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.2" stroke="currentColor" stroke-width="1.6"/></svg><span>村落分布</span></a><a href="/ai"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m18.5 16 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z" fill="currentColor"/></svg><span>AI问答</span></a></nav><a class="header-action" href="/feedback">意见反馈</a></div></header>
<section class="city-head"><img class="city-line city-line-eaves" src="/static/home-demo/line-eaves.svg" alt="" aria-hidden="true"><img class="city-line city-line-cloud" src="/static/home-demo/line-cloud.svg" alt="" aria-hidden="true"><div class="city-head-inner"><a class="back" href="/villages">← 返回陕西村落分布</a><p class="city-kicker">CITY VILLAGE ARCHIVE <span>陕西 · 传统村落</span></p><div class="city-title-row"><h1 id="cityName">村落</h1><span class="city-seal">秦</span></div><p id="cityMeta">正在加载村落资料…</p><p class="city-verse">山河有境 · 村落在册</p><span class="city-watermark" id="cityWatermark" aria-hidden="true">城市</span></div></section>
<main class="city-body" id="villageList"></main>
<footer class="footer"><div><strong>寻迹三秦 · 陕西传统村落数字档案</strong><br>城市村落影像长廊</div><div>点击村落进入独立村落首页</div></footer>
<script>
const slug=location.pathname.split('/').filter(Boolean).pop();
const list=document.getElementById('villageList');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/cities/'+encodeURIComponent(slug)+'/villages').then(r=>{if(!r.ok)throw new Error('City not found');return r.json()}).then(data=>{
  const displayCityName=(data.city.name||'').replace(/\u5e02$/,'');document.title=displayCityName+' \u00b7 \u6751\u843d\u5206\u5e03';
  const cityChars=Array.from(displayCityName||'\u6751\u843d');
  const cityFirst=cityChars.shift()||'\u6751';
  document.getElementById('cityName').innerHTML=`<span>${esc(cityFirst)}</span>${esc(cityChars.join(''))}`;
  document.getElementById('cityWatermark').textContent=displayCityName;
  document.getElementById('cityMeta').textContent='\u5df2\u6536\u5f55 '+data.villages.length+' \u4e2a\u4f20\u7edf\u6751\u843d';
  if(!data.villages.length){list.innerHTML='<div class="empty">\u8be5\u57ce\u5e02\u6682\u672a\u6536\u5f55\u6751\u843d\u8d44\u6599\u3002</div>';return}
  const arts=['line-bamboo.svg','line-plum.svg','line-eaves.svg','line-cloud.svg','line-mountains.svg','line-crane.svg','line-fan.svg','line-lantern.svg','line-bridge.svg','line-tea.svg','line-chrysanthemum.svg','line-pine.svg'];
  const colors=['#9a6548','#4f6b61','#687b90','#80604f'];
  const intro=`<section class="city-intro"><div><div class="city-intro-kicker">01 \u00b7 CITY NOTES</div><h2>\u4e00\u57ce\u6751\u843d\uff0c<span>\u5404\u6709\u6765\u5904\u3002</span></h2><p>\u8fd9\u91cc\u6536\u5f55\u4e86 ${esc(displayCityName)} \u7684 ${data.villages.length} \u4e2a\u4f20\u7edf\u6751\u843d\u3002\u4ece\u6751\u540d\u8fdb\u5165\u6863\u6848\uff0c\u4e86\u89e3\u5b83\u4eec\u7684\u5386\u53f2\u3001\u5efa\u7b51\u3001\u73af\u5883\u4e0e\u6c11\u4fd7\u3002</p></div><img class="city-intro-art" src="/static/home-demo/line-mountains.svg" alt=""></section>`;
  list.innerHTML=intro+data.villages.map((v,index)=>{
    const hiRes=u=>String(u).replace('/x_','/');
    const gallery=(v.gallery_images||[]).map(x=>typeof x==='string'?x:x.url).filter(Boolean);
    const imgs=(gallery.length?gallery:(v.images||[])).map(hiRes).filter(Boolean).slice(0,3);
    const villageHref='/villages/'+encodeURIComponent(slug)+'/'+encodeURIComponent(v.source_id||v.id);
    const slides=imgs.map((u,i)=>`<img class="${i===0?'active':''}" src="${esc(u)}" alt="${esc(v.name)}\u6751\u843d\u5f71\u50cf ${i+1}" loading="${i?'lazy':'eager'}" decoding="async" referrerpolicy="no-referrer">`).join('');
    const dots=imgs.length>1?`<div class="carousel-dots">${imgs.map((_,i)=>`<button class="${i===0?'active':''}" aria-label="\u5207\u6362${esc(v.name)}\u56fe\u7247 ${i+1}"></button>`).join('')}</div>`:'';
    const ornament=arts[index%arts.length];
    const color=colors[index%colors.length];
    return `<article class="village-entry" style="--entry-color:${color}"><img class="entry-line-art" src="/static/home-demo/${ornament}" alt="" aria-hidden="true"><div class="entry-copy"><div class="entry-top"><span class="entry-index">${String(index+1).padStart(2,'0')}</span><span class="entry-rule"></span></div><h2><a class="village-name" href="${villageHref}">${esc(v.name)}</a></h2><p class="meta">${esc(v.location)}</p><p class="entry-note">\u70b9\u51fb\u6751\u540d\u8fdb\u5165\u6751\u843d\u6863\u6848</p></div>${imgs.length?`<div class="village-carousel" data-carousel>${slides}${dots}</div>`:''}</article>`;
  }).join('');
  document.querySelectorAll('[data-carousel]').forEach(box=>{const imgs=[...box.querySelectorAll('img')],dots=[...box.querySelectorAll('.carousel-dots button')];if(imgs.length<2)return;let i=0,switching=false;const preload=img=>new Promise(resolve=>{if(img.complete){resolve(img.naturalWidth>0);return}img.addEventListener('load',()=>resolve(true),{once:true});img.addEventListener('error',()=>resolve(false),{once:true})});const go=async n=>{if(n===i||switching)return;switching=true;const ok=await preload(imgs[n]);if(ok){imgs[i].classList.remove('active');dots[i]?.classList.remove('active');i=n;imgs[i].classList.add('active');dots[i]?.classList.add('active')}switching=false};dots.forEach((d,n)=>d.onclick=e=>{e.preventDefault();e.stopPropagation();go(n)});setInterval(()=>go((i+1)%imgs.length),4500)});
}).catch(e=>{document.getElementById('cityName').textContent='村落分布';document.getElementById('cityMeta').textContent='城市资料加载失败';list.innerHTML='<div class="empty">城市资料加载失败。</div>'});
</script>
<script>window.addEventListener("pageshow",event=>{if(event.persisted)window.location.reload()});</script>
</body></html>
