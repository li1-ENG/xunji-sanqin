/* Unified global navigation */
.site-header{position:sticky;top:0;z-index:30;height:78px;background:#fffffff2;backdrop-filter:blur(16px);border-bottom:0}
.nav-shell{width:min(1360px,calc(100% - 80px));height:100%;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
.brand{justify-self:start;display:flex;flex-direction:column;line-height:1.15;letter-spacing:.12em}
.brand strong{font-size:18px;font-weight:500;letter-spacing:.12em}
.brand small{display:block;margin-top:5px;color:var(--muted);font-size:8px;letter-spacing:.28em}
.main-nav{display:flex;align-items:center;gap:4px;width:max-content;padding:5px;border-radius:999px;background:#fff;box-shadow:0 5px 18px #20252208}
.main-nav a{position:relative;display:flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;color:#5c6660;font-size:16px;font-weight:500;line-height:1;white-space:nowrap;transition:.2s}
.main-nav a:hover{background:var(--soft,#f4f4f1);color:var(--ink)}
.main-nav a.active{background:var(--soft,#f4f4f1);color:var(--ink);font-weight:600;box-shadow:0 3px 12px #20252210}
.main-nav a.active:after{content:none}
.main-nav svg{width:17px;height:17px;opacity:.72}
.main-nav a.active svg{opacity:1;color:var(--accent)}
.header-action{justify-self:end;border-radius:999px;padding:9px 17px;background:#fff;color:var(--muted);font-size:12px}
@media(max-width:1120px){.nav-shell{width:calc(100% - 32px)}.main-nav{gap:2px}.main-nav a{padding:0 13px;font-size:15px;gap:6px}.main-nav svg{width:15px;height:15px}.header-action{padding:8px 13px}}
@media(max-width:900px){.nav-shell{width:calc(100% - 32px);grid-template-columns:1fr auto}.main-nav{display:none}}

const $=id=>document.getElementById(id);
const pathParts=location.pathname.split('/').filter(Boolean);const VILLAGE_ID=new URLSearchParams(location.search).get('id')||(pathParts[0]==='villages'&&pathParts.length>=3?decodeURIComponent(pathParts[2]||''):pathParts[0]==='village'?decodeURIComponent(pathParts[1]||''):'')||'61058110401';

let village=null,heroSlides=[],heroDots=[],heroIndex=0,timer=null,heroImages=[],homeGalleryImages=[],sectionImageMap=new Map(),historicImageMap=new Map();

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function short(v,n){v=(v||'').replace(/\s+/g,' ');return v.length>n?v.slice(0,n)+'…':v}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function factValue(k,v){if(k==='village_area_sqkm')return v+' 平方公里';if(k==='registered_population')return v+' 人';if(k==='elevation_m')return v+' 米';return v}
function paragraphGroups(text,maxGroups=0){const s=(text||'').trim();if(!s)return [];const parts=s.match(/[^\u3002\uff01\uff1f]+[\u3002\uff01\uff1f]?/g)||[s];const natural=Math.ceil(parts.length/2);const count=maxGroups?Math.min(maxGroups,natural):natural;const size=Math.max(1,Math.ceil(parts.length/count));const groups=[];for(let i=0;i<parts.length;i+=size)groups.push(parts.slice(i,i+size).join('').trim());return groups.filter(Boolean)}
function paragraphs(text){return paragraphGroups(text).map(x=>`<p>${esc(x)}</p>`).join('')}

function imageFigure(img,alt,cls='pair-media'){if(!img?.url)return '';return `<figure class="${cls}"><img src="${esc(mediaUrl(img.url))}" alt="${esc(img.title||alt)}" loading="lazy"><figcaption>${esc(img.title||alt)}</figcaption></figure>`}
function renderEditorialRows(text,images,alt,title='',kicker=''){const body=(text||'').trim();const imgs=(images||[]).filter(x=>x&&x.url);if(!body&&!imgs.length)return `<p class="empty-note">暂无详细资料。</p>`;const card=`<div class="text-card">${kicker?`<div class="card-kicker">${esc(kicker)}</div>`:''}${title?`<h3>${esc(title)}</h3>`:''}${body.length>220?`<div class="scroll-tip">框内向下滞动查看全文</div>`:''}<div class="body text-scroll">${paragraphs(body)||`<p class="empty-note">暂无详细文字。</p>`}</div></div>`;if(!imgs.length)return card;const chosen=imgs.length>=4?imgs.slice(0,4):imgs.length>=2?imgs.slice(0,2):imgs.slice(0,1);const count=chosen.length;const tiles=chosen.map(x=>`<figure class="image-tile"><img src="${esc(mediaUrl(x.url))}" alt="${esc(x.title||alt)}" loading="lazy"><figcaption>${esc(x.title||alt)}</figcaption></figure>`).join('');if(count===2){const slides=chosen.map((x,i)=>`<figure class="carousel-slide ${i===0?'active':''}"><img src="${esc(mediaUrl(x.url))}" alt="${esc(x.title||alt)}" loading="lazy"><figcaption>${esc(x.title||alt)}</figcaption></figure>`).join('');const dots=chosen.map((x,i)=>`<button class="${i===0?'active':''}" aria-label="切换图片 ${i+1}"></button>`).join('');return `<div class="section-pair"><div class="image-carousel" data-carousel>${slides}<div class="carousel-dots">${dots}</div></div><div class="pair-copy">${card}</div></div>`}return `<div class="section-pair"><div class="image-collage count-${count}">${tiles}</div><div class="pair-copy">${card}</div></div>`}

function sectionsFor(tab){

  return `<section class="food-atlas reveal"><div class="food-atlas-head"><div><span>LOCAL CATALOG \u00b7 \u7269\u4ea7\u56fe\u9274</span><h3>\u5c71\u7530\u6240\u51fa\uff0c\u56db\u65f6\u6709\u5473</h3></div><p>\u4ece\u5730\u65b9\u996e\u98df\u3001\u519c\u4e8b\u751f\u4ea7\u548c\u7279\u8272\u7269\u4ea7\u4e2d\uff0c\u6574\u7406\u8fd9\u5ea7\u6751\u843d\u7684\u65e5\u5e38\u6ecb\u5473\u3002</p></div><div class="food-atlas-grid">${items.map((s,index)=>{const text=(s.content_text||'').replace(/\s+/g,' ').trim();const snippet=text.length>78?text.slice(0,78)+'\u2026':text;return `<article class="food-card"><img src="/static/home-demo/${icons[index%icons.length]}" alt="" aria-hidden="true"><div><small>${s.type==='food'?'\u98ce\u5473':'\u7269\u4ea7'}</small><h4>${esc(s.title||'\u5730\u65b9\u7269\u4ea7')}</h4><p>${esc(snippet||'\u6682\u65e0\u8be6\u7ec6\u8bf4\u660e')}</p></div></article>`}).join('')}</div></section>`;
}

function renderFactsTable(items){const rows=[];for(let i=0;i<items.length;i+=2){const a=items[i],b=items[i+1];rows.push(`<tr><th>${esc(a.label)}</th><td>${esc(a.value)}</td>${b?`<th>${esc(b.label)}</th><td>${esc(b.value)}</td>`:'<th></th><td></td>'}</tr>`)}return `<table class="village-info-table"><tbody>${rows.join('')}</tbody></table>`}
function renderHome(){
  const attrs=village.attributes||{};const factItems=Object.entries(FACT_LABEL).filter(([k])=>attrs[k]).map(([k,label])=>({label,value:factValue(k,attrs[k])}));const facts=renderFactsTable(factItems);
  const imgs=homeGalleryImages;
  const featureDefs=[['history','历史文化','从村落迁徙与建村故事开始'],['architecture','传统建筑','看院落、街巷与营造智慧'],['customs','民俗文化','节庆、礼俗与非遗项目']].filter(([t])=>availableTabs().includes(t));
  return `${artPageHead('home','村落首页',TAB_DESC.home,'VILLAGE HOME')}
  <div class="home-editorial reveal">${renderEditorialRows([village.summary,village.description_text].filter(Boolean).join('\n\n'),imgs,village.name,'村落概况','VILLAGE PROFILE')}</div>
  <div class="home-facts reveal">${facts}</div>
  <div class="feature-links reveal">${featureDefs.map(([t,title,desc])=>`<button class="feature" data-jump="${t}"><small>EXPLORE</small><strong>${title}</strong><span>${desc}</span></button>`).join('')}</div></div>`;
}function renderContentSection(s){return `<section class="content-section reveal">${renderEditorialRows(s.content_text,s.images||[],s.title||village.name,s.title||TAB_LABEL[s.type]||'\u6751\u843d\u6863\u6848','\u6751\u843d\u6863\u6848')}</section>`}
function renderPeople(){if(!village.figures?.length)return '';return `<section class="content-section reveal"><h3>\u5386\u53f2\u4eba\u7269</h3><div class="people-grid">${village.figures.map(p=>`<article class="person"><h4>${esc(p.name)}</h4><div class="body">${paragraphs(p.content_text)}</div></article>`).join('')}</div></section>`}
function renderElements(){if(!village.historic_elements?.length)return '';return `<section class="content-section reveal"><h3>\u5386\u53f2\u73af\u5883\u8981\u7d20</h3><div class="element-grid">${village.historic_elements.map(x=>`<article class="element"><h4>${esc(x.name||'\u5386\u53f2\u73af\u5883\u8981\u7d20')}</h4>${x.images?.length?`<div class="element-images">${x.images.slice(0,4).map(im=>`<img src="${esc(im.url)}" alt="${esc(im.title||x.name)}" loading="lazy">`).join('')}</div>`:''}</article>`).join('')}</div></section>`}
function renderPage(tab){
  if(!village)return;
  document.body.dataset.tab=tab;
  document.body.classList.toggle('subpage',tab!=='home');
  if(tab==='home'){$('content').innerHTML=renderHome()}
  else{
    const sections=sectionsFor(tab);const atlas=tab==='food'?renderFoodAtlas(sections):'';let html=`${artPageHead(tab,TAB_LABEL[tab]||'\u6751\u843d\u6863\u6848',TAB_DESC[tab]||'',tab.toUpperCase())}${atlas}<div class="section-list">${sections.map(renderContentSection).join('')}`;
    if(tab==='history')html+=renderPeople();
    if(tab==='architecture')html+=renderElements();
    html+=`</div></div>`;$('content').innerHTML=html;
  }
  $('content').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.jump;window.scrollTo({top:$('villageNavWrap').offsetTop,behavior:'smooth'})});
  annotateCultureTerms($('content'));hideCultureTooltip();observeReveal();initCarousels();updateReadingProgress();
}
let carouselTimers=[];
function initCarousels(){carouselTimers.forEach(clearInterval);carouselTimers=[];document.querySelectorAll('[data-carousel]').forEach(el=>{const slides=[...el.querySelectorAll('.carousel-slide')];const dots=[...el.querySelectorAll('.carousel-dots button')];if(slides.length<2)return;let index=0;const go=n=>{index=n;slides.forEach((x,i)=>x.classList.toggle('active',i===n));dots.forEach((x,i)=>x.classList.toggle('active',i===n))};dots.forEach((b,i)=>b.onclick=()=>go(i));carouselTimers.push(setInterval(()=>go((index+1)%slides.length),4500))})}
function observeReveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(x=>io.observe(x))}
function showSlide(i){if(!heroSlides.length)return;heroIndex=i;heroSlides.forEach((x,n)=>x.classList.toggle('active',n===i));heroDots.forEach((x,n)=>x.classList.toggle('active',n===i))}
function startHero(images){heroSlides=images.map((u,i)=>{const d=document.createElement('div');d.className='hero-slide'+(i===0?' active':'');d.style.backgroundImage=`url("${u}")`;return d});$('heroSlides').replaceChildren(...heroSlides);$('heroDots').innerHTML=images.map((_,i)=>`<button class="${i===0?'active':''}" aria-label="村落图片 ${i+1}"></button>`).join('');heroDots=[...$('heroDots').children];heroDots.forEach((b,i)=>b.onclick=()=>showSlide(i));if(timer)clearInterval(timer);if(images.length>1)timer=setInterval(()=>showSlide((heroIndex+1)%images.length),6500)}
const CULTURE_GLOSSARY=Object.freeze({
  '\u5889\u5934':'\u5c71\u5899\u6a90\u67f1\u4e0a\u65b9\u4f38\u51fa\u7684\u88c5\u9970\u6784\u4ef6\uff0c\u5e38\u89c1\u7816\u96d5\u6216\u6728\u96d5\u3002',
  '\u5f71\u58c1':'\u4f4d\u4e8e\u9662\u95e8\u5185\u5916\u3001\u7528\u4e8e\u906e\u6321\u89c6\u7ebf\u548c\u88c5\u9970\u7684\u5899\u4f53\u3002',
  '\u7167\u58c1':'\u4f20\u7edf\u5efa\u7b51\u4e2d\u6b63\u5bf9\u5927\u95e8\u6216\u9053\u8def\u7684\u5c4f\u5899\uff0c\u517c\u5177\u906e\u6321\u4e0e\u88c5\u9970\u4f5c\u7528\u3002',
  '\u95e8\u697c':'\u5b85\u9662\u5165\u53e3\u5904\u5e26\u6709\u5c4b\u9876\u548c\u88c5\u9970\u7684\u95e8\u5934\u5efa\u7b51\u3002',
  '\u56db\u5408\u9662':'\u7531\u56db\u9762\u623f\u5c4b\u56f4\u5408\u51fa\u5ead\u9662\u7684\u4f20\u7edf\u9662\u843d\u5f62\u5f0f\u3002',
  '\u7960\u5802':'\u5b97\u65cf\u796d\u7940\u7956\u5148\u3001\u8bae\u4e8b\u548c\u4e3e\u884c\u793c\u4eea\u7684\u573a\u6240\u3002',
  '\u65cf\u8c31':'\u8bb0\u5f55\u5b97\u65cf\u4e16\u7cfb\u3001\u4eba\u7269\u548c\u5bb6\u8bad\u7684\u8c31\u724d\u6587\u732e\u3002',
  '\u7a91\u6d1e':'\u9ec4\u571f\u9ad8\u539f\u5730\u533a\u4f9d\u571f\u5d16\u5f00\u51ff\u6216\u780c\u7b51\u7684\u62f1\u5f62\u5c45\u6240\u3002',
  '\u7a7f\u6597':'\u4ee5\u67f1\u548c\u7a7f\u67a1\u6784\u6210\u5c4b\u67b6\u7684\u5357\u65b9\u6728\u6784\u5f62\u5f0f\u3002',
  '\u7816\u96d5':'\u5728\u7816\u6784\u4ef6\u4e0a\u96d5\u523b\u56fe\u6848\u7684\u4f20\u7edf\u88c5\u9970\u5de5\u827a\u3002',
  '\u77f3\u96d5':'\u5728\u77f3\u6750\u4e0a\u96d5\u523b\u7eb9\u6837\u3001\u6587\u5b57\u6216\u6784\u4ef6\u7684\u5de5\u827a\u3002',
  '\u6728\u96d5':'\u5728\u6728\u6750\u4e0a\u96d5\u523b\u88c5\u9970\u7eb9\u6837\u7684\u4f20\u7edf\u5de5\u827a\u3002'
});
function showCultureTooltip(el){
  const tip=$('cultureTooltip'),rect=el.getBoundingClientRect();
  tip.textContent=el.dataset.definition||'';tip.classList.add('visible');tip.setAttribute('aria-hidden','false');
  const box=tip.getBoundingClientRect();let left=Math.max(12,Math.min(innerWidth-box.width-12,rect.left+rect.width/2-box.width/2));let top=rect.bottom+9;
  if(top+box.height>innerHeight-12)top=Math.max(12,rect.top-box.height-9);
  tip.style.left=left+'px';tip.style.top=top+'px';
}
function hideCultureTooltip(){const tip=$('cultureTooltip');if(tip){tip.classList.remove('visible');tip.setAttribute('aria-hidden','true')}}
function annotateCultureTerms(root){
  if(!root)return;
  const used=new Set(),terms=Object.keys(CULTURE_GLOSSARY).sort((a,b)=>b.length-a.length);
  for(const p of root.querySelectorAll('.text-card .body p')){
    const walker=document.createTreeWalker(p,NodeFilter.SHOW_TEXT),nodes=[];let node;
    while(node=walker.nextNode())nodes.push(node);
    outer:for(const textNode of nodes){
      for(const term of terms){
        if(used.has(term))continue;
        const index=textNode.nodeValue.indexOf(term);if(index<0)continue;
        const span=document.createElement('span');span.className='culture-term';span.tabIndex=0;span.setAttribute('role','button');span.dataset.definition=CULTURE_GLOSSARY[term];span.setAttribute('aria-label',term+'\uff1a'+CULTURE_GLOSSARY[term]);span.textContent=term;
        const before=document.createTextNode(textNode.nodeValue.slice(0,index)),after=document.createTextNode(textNode.nodeValue.slice(index+term.length));
        textNode.replaceWith(before,span,after);used.add(term);
        span.addEventListener('mouseenter',()=>showCultureTooltip(span));span.addEventListener('mouseleave',hideCultureTooltip);span.addEventListener('focus',()=>showCultureTooltip(span));span.addEventListener('blur',hideCultureTooltip);span.addEventListener('click',e=>{e.stopPropagation();showCultureTooltip(span)});span.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showCultureTooltip(span)}});
        break outer;
      }
    }
  }
}
function updateReadingProgress(){const max=document.documentElement.scrollHeight-innerHeight;const ratio=max>0?Math.min(1,Math.max(0,scrollY/max)):0;$('readingProgressBar').style.transform='scaleX('+ratio+')';$('backToTop').classList.toggle('visible',scrollY>520)}
function initOverlayFeatures(){
  $('backToTop').addEventListener('click',()=>{window.scrollTo({top:0,behavior:'auto'});updateReadingProgress()});addEventListener('scroll',updateReadingProgress,{passive:true});addEventListener('resize',updateReadingProgress);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCultureTooltip()});
  document.addEventListener('click',e=>{if(!e.target.closest('.culture-term'))hideCultureTooltip()});updateReadingProgress();
}

async function load(){
  const r=await fetch('/api/villages/'+VILLAGE_ID);if(!r.ok)throw new Error('村落数据加载失败');village=await r.json();
  const nameChars=Array.from(village.name||'村'),heroGlyph=nameChars[0]||'村';document.title=village.name+' · 陕西传统村落';$('villageName').innerHTML=`<span>${esc(heroGlyph)}</span>${esc(nameChars.slice(1).join(''))}`;$('villageCity').textContent=village.city.name;$('villageLocation').textContent=village.location.replace(village.city.name,'').replace(/^[·\s]+/,'');$('source').innerHTML=`<a href="${esc(village.source_url)}" target="_blank" rel="noreferrer">查看原始资料 ↗</a>`;
  const sourceImages=village.id==='61058110401'?PARTY_IMAGES:(village.images||[]).filter(x=>x&&x.url);const unique=[];const seen=new Set();for(const im of sourceImages){const u=typeof im==='string'?im:im.url;if(u&&!seen.has(u)){seen.add(u);unique.push(typeof im==='string'?{url:u,title:village.name}:im)}}const pool=shuffle(unique);heroImages=pool.slice(0,2);homeGalleryImages=pool.slice(2,6);const used=new Set([...heroImages,...homeGalleryImages].map(x=>x.url));sectionImageMap.clear();for(const sec of village.sections||[]){const available=(sec.images||[]).filter(im=>im&&im.url&&!used.has(im.url));const count=available.length>=4?4:available.length>=2?2:available.length?1:0;const assigned=available.slice(0,count);sectionImageMap.set(String(sec.id),assigned);assigned.forEach(im=>used.add(im.url))}historicImageMap.clear();for(const item of village.historic_elements||[]){const available=(item.images||[]).filter(im=>im&&im.url&&!used.has(im.url));const assigned=available.slice(0,4);historicImageMap.set(String(item.id),assigned);assigned.forEach(im=>used.add(im.url))}startHero(heroImages.length?heroImages.map(x=>x.url):PARTY_IMAGES.map(x=>x.url));renderNav();renderPage((location.hash||'#home').slice(1)||'home');
}
window.addEventListener('hashchange',()=>{const t=(location.hash||'#home').slice(1);renderNav();renderPage(t);window.scrollTo({top:0,behavior:'auto'})});
initOverlayFeatures();
load().catch(e=>{$('content').innerHTML=`<div class="page-head"><div><div class="page-kicker">ERROR</div><h2>页面加载失败</h2></div><p>${esc(e.message)}，请确认后端服务正在运行。</p></div>`});
</script>
